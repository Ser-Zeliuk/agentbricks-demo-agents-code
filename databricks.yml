bundle:
  name: agent_langgraph

resources:
  # MLflow experiment for agent tracing - automatically created by bundle
  experiments:
    agent_langgraph_experiment:
      name: /Users/${workspace.current_user.userName}/${bundle.name}-${bundle.target}

  apps:
    agent_langgraph:
      name: "${bundle.target}-agent-langgraph"
      description: "LangGraph agent application"
      source_code_path: ./

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "${resources.experiments.agent_langgraph_experiment.id}"
            permission: 'CAN_MANAGE'
        - name: 'calculate_costs_sql'
          uc_securable:
            securable_full_name: 'agenbrick_demo.default.calculate_costs_sql'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'calculate_experiment_costs'
          uc_securable:
            securable_full_name: 'agenbrick_demo.default.calculate_experiment_costs'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'extract_materials_from_protocol'
          uc_securable:
            securable_full_name: 'agenbrick_demo.default.extract_materials_from_protocol'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'run_gap_analysis'
          uc_securable:
            securable_full_name: 'agenbrick_demo.default.run_gap_analysis'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph:
          name: agent-langgraph
